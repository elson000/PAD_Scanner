<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>DIP 產線操作介面</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F0EEE9;
  --surface:#FFFFFF;
  --border:#DDD9D0;
  --border2:#B8B4AA;
  --text:#18170F;
  --text2:#6A6860;
  --text3:#9B9890;
  --accent:#1D4FA8;
  --accent-bg:#EAF0FB;
  --green:#1A7A4A;
  --green-bg:#E6F4EC;
  --green-border:#9FD8BA;
  --amber:#8A5A00;
  --amber-bg:#FEF3DC;
  --red:#B83232;
  --red-bg:#FCEAEA;
  --purple:#4A3BAA;
  --purple-bg:#EEEDFB;
  --radius:12px;
  --radius-sm:8px;
}
html,body{height:100%;background:var(--bg);font-family:'Noto Sans TC',sans-serif;font-size:15px;color:var(--text)}
.app{max-width:480px;margin:0 auto;padding:16px;min-height:100vh}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.header-title{font-size:17px;font-weight:700}
.header-sub{font-size:12px;color:var(--text3);margin-top:2px}
.admin-link{font-size:12px;color:var(--accent);text-decoration:none;padding:6px 12px;border:1px solid var(--accent-bg);border-radius:20px;background:var(--accent-bg)}

/* Step bar */
.step-bar{display:flex;gap:6px;margin-bottom:20px;align-items:center}
.step-seg{flex:1;height:5px;border-radius:3px;background:var(--border);transition:background .3s}
.step-seg.done{background:var(--green)}
.step-seg.active{background:var(--accent)}
.step-label{font-size:11px;font-weight:700;color:var(--text3);white-space:nowrap}

/* Card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px}
.card-title{font-size:13px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}

/* Scan target */
.scan-target{display:flex;align-items:center;gap:12px;background:var(--bg);border:1.5px dashed var(--border2);border-radius:var(--radius-sm);padding:14px 16px;cursor:pointer;min-height:56px;transition:all .2s}
.scan-target:active{transform:scale(.98)}
.scan-target.filled{background:var(--green-bg);border:1.5px solid var(--green-border);cursor:default}
.scan-target.error{background:var(--red-bg);border:1.5px solid #EEB0B0}
.scan-ico{font-size:22px;flex-shrink:0}
.scan-ph{font-size:14px;color:var(--text3)}
.scan-val{font-size:14px;font-weight:700;color:var(--text);flex:1}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.badge-scan{background:var(--purple-bg);color:var(--purple)}
.badge-manual{background:var(--amber-bg);color:var(--amber)}
.badge-op{background:var(--accent-bg);color:var(--accent)}
.badge-sup{background:var(--green-bg);color:var(--green)}

/* Worker chips */
.workers-list{display:flex;flex-direction:column;gap:7px;margin-bottom:10px}
.worker-chip{display:flex;align-items:center;gap:9px;padding:9px 12px;background:var(--green-bg);border:1px solid var(--green-border);border-radius:var(--radius-sm)}
.w-avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-bg);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--accent);flex-shrink:0}
.w-name{font-size:13px;font-weight:700;flex:1}
.w-rm{background:none;border:none;font-size:18px;color:var(--text3);cursor:pointer;line-height:1;padding:0 4px}

/* Input row */
.input-row{display:flex;gap:8px;margin-top:10px}
.input-row input{flex:1;height:42px;padding:0 12px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-family:'Noto Sans TC',sans-serif;font-size:14px;color:var(--text);background:var(--surface);outline:none}
.input-row input:focus{border-color:var(--accent)}
.input-row button{height:42px;padding:0 16px;border-radius:var(--radius-sm);font-family:'Noto Sans TC',sans-serif;font-size:13px;font-weight:700;cursor:pointer;border:none;white-space:nowrap}
.btn-scan{background:var(--purple-bg);color:var(--purple)}
.btn-manual{background:var(--amber-bg);color:var(--amber)}
.btn-add{background:var(--accent-bg);color:var(--accent)}

/* Add worker section */
.add-section{margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.add-title{font-size:12px;color:var(--text3);margin-bottom:8px}

/* Nav buttons */
.nav-row{display:flex;gap:8px;margin-top:4px}
.btn-next{flex:1;height:48px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font-family:'Noto Sans TC',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:all .15s}
.btn-next:disabled{background:var(--border);color:var(--text3);cursor:default}
.btn-next:not(:disabled):active{transform:scale(.98)}
.btn-back{height:48px;padding:0 18px;background:var(--surface);color:var(--text2);border:1px solid var(--border2);border-radius:var(--radius-sm);font-family:'Noto Sans TC',sans-serif;font-size:14px;cursor:pointer}

/* Error msg */
.err-msg{font-size:12px;color:var(--red);margin-top:6px;padding:6px 10px;background:var(--red-bg);border-radius:var(--radius-sm)}

/* Confirm card */
.confirm-row{display:flex;align-items:flex-start;gap:8px;padding:9px 0;border-bottom:1px solid var(--border)}
.confirm-row:last-child{border-bottom:none}
.confirm-key{font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;width:52px;flex-shrink:0;padding-top:2px;letter-spacing:.04em}
.confirm-vals{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.confirm-chip{font-size:13px;font-weight:700;font-family:'JetBrains Mono',monospace;background:var(--bg);padding:3px 8px;border-radius:6px;border:1px solid var(--border)}
.btn-submit{width:100%;height:52px;background:var(--green);color:#fff;border:none;border-radius:var(--radius-sm);font-family:'Noto Sans TC',sans-serif;font-size:16px;font-weight:700;cursor:pointer;margin-top:16px;transition:all .15s}
.btn-submit:active{transform:scale(.98)}

/* Success */
.success-box{text-align:center;padding:32px 20px}
.success-icon{font-size:52px;margin-bottom:12px}
.success-title{font-size:20px;font-weight:700;margin-bottom:4px}
.success-sub{font-size:13px;color:var(--text3);font-family:'JetBrains Mono',monospace}
.btn-new{width:100%;height:50px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font-family:'Noto Sans TC',sans-serif;font-size:15px;font-weight:700;cursor:pointer;margin-top:20px}

/* Log section */
.log-item{padding:10px 0;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:10px}
.log-item:last-child{border-bottom:none}
.log-dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0;margin-top:5px}
.log-main{flex:1}
.log-title{font-size:13px;font-weight:700}
.log-sub{font-size:11px;color:var(--text3);margin-top:2px;font-family:'JetBrains Mono',monospace}
.log-time{font-size:11px;color:var(--text3);white-space:nowrap}
.btn-clear{font-size:12px;color:var(--red);background:none;border:none;cursor:pointer;padding:0;margin-top:8px}

/* No config warning */
.warn-box{background:var(--amber-bg);border:1px solid #F0C060;border-radius:var(--radius-sm);padding:12px 14px;font-size:13px;color:var(--amber);margin-bottom:14px}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div>
      <div class="header-title">DIP 操作介面</div>
      <div class="header-sub" id="clock">--:--:--</div>
    </div>
    <a href="admin.html" class="admin-link">⚙ 後台管理</a>
  </div>

  <div id="no-config-warn" class="warn-box" style="display:none">
    ⚠️ 尚未設定工站或員工資料，請先至後台管理設定。
  </div>

  <!-- Step bar -->
  <div class="step-bar">
    <div class="step-seg active" id="ss0"></div>
    <div class="step-seg" id="ss1"></div>
    <div class="step-seg" id="ss2"></div>
    <div class="step-seg" id="ss3"></div>
    <div class="step-label" id="headerStep">步驟 1 / 4</div>
  </div>

  <!-- Step 0: Employee -->
  <div id="step0">
    <div class="card">
      <div class="card-title">員工掃碼 / 輸入</div>
      <div class="workers-list" id="workersList"></div>
      <div id="empBox" class="scan-target" onclick="document.getElementById('empIn').focus()">
        <span class="scan-ico">👤</span>
        <span class="scan-ph">點此掃碼或輸入員工編號</span>
      </div>
      <div id="empErr" class="err-msg" style="display:none"></div>
      <div class="input-row">
        <input type="text" id="empIn" placeholder="員工編號（Enter 掃碼確認）" onkeydown="handleEmpKey(event)">
        <button class="btn-scan" onclick="confirmEmp('scan')">掃碼</button>
        <button class="btn-manual" onclick="confirmEmp('manual')">手動</button>
      </div>
      <div id="addSection" style="display:none" class="add-section">
        <div class="add-title">加派人員（選填）</div>
        <div class="input-row">
          <input type="text" id="extraIn" placeholder="加派員工編號" onkeydown="handleExtraKey(event)">
          <button class="btn-add" onclick="addExtra('scan')">加入</button>
        </div>
      </div>
    </div>
    <div class="nav-row">
      <button class="btn-next" id="btnEmpNext" disabled onclick="goStep(1)">下一步：掃工站</button>
    </div>
  </div>

  <!-- Step 1: Station -->
  <div id="step1" style="display:none">
    <div class="card">
      <div class="card-title">工站 QR Code</div>
      <div id="stBox" class="scan-target" onclick="document.getElementById('stIn').focus()">
        <span class="scan-ico">🏭</span>
        <span class="scan-ph">點此掃描工站 QR Code</span>
      </div>
      <div id="stErr" class="err-msg" style="display:none"></div>
      <div class="input-row">
        <input type="text" id="stIn" placeholder="工站代號（例：ST-01）" onkeydown="handleStKey(event)">
        <button class="btn-scan" onclick="confirmStation('scan')">掃碼</button>
        <button class="btn-manual" onclick="confirmStation('manual')">手動</button>
      </div>
    </div>
    <div class="nav-row">
      <button class="btn-back" onclick="goStep(0)">返回</button>
      <button class="btn-next" id="btnStNext" disabled onclick="goStep(2)">下一步：掃工單</button>
    </div>
  </div>

  <!-- Step 2: Work Order -->
  <div id="step2" style="display:none">
    <div class="card">
      <div class="card-title">工單條碼</div>
      <div id="woBox" class="scan-target" onclick="document.getElementById('woIn').focus()">
        <span class="scan-ico">📋</span>
        <span class="scan-ph">點此掃描工單條碼</span>
      </div>
      <div class="input-row">
        <input type="text" id="woIn" placeholder="工單號（例：WO-20250526-001）" onkeydown="handleWoKey(event)">
        <button class="btn-scan" onclick="confirmWo('scan')">掃碼</button>
        <button class="btn-manual" onclick="confirmWo('manual')">手動</button>
      </div>
    </div>
    <div class="nav-row">
      <button class="btn-back" onclick="goStep(1)">返回</button>
      <button class="btn-next" id="btnWoNext" disabled onclick="goStep(3)">下一步：確認送出</button>
    </div>
  </div>

  <!-- Step 3: Confirm -->
  <div id="step3" style="display:none">
    <div class="card">
      <div class="card-title">確認資料</div>
      <div id="confirmCard"></div>
      <button class="btn-submit" onclick="submitRecord()">✓ 確認送出</button>
    </div>
    <div class="nav-row">
      <button class="btn-back" onclick="goStep(2)">返回修改</button>
    </div>
  </div>

  <!-- Step 4: Success -->
  <div id="step4" style="display:none">
    <div class="card">
      <div class="success-box">
        <div class="success-icon">✅</div>
        <div class="success-title">送出成功</div>
        <div class="success-sub" id="savedId">--</div>
      </div>
      <button class="btn-new" onclick="resetFlow()">＋ 新增下一筆</button>
    </div>
    <div class="card">
      <div class="card-title">今日記錄 <button class="btn-clear" onclick="clearLog()">清除全部</button></div>
      <div id="logList"></div>
    </div>
  </div>
</div>

<script>
// ── 狀態 ──
const S = { workers:[], station:null, stationName:null, stationMethod:null, order:null, orderMethod:null };

// ── localStorage 存取 ──
function getStations()  { return JSON.parse(localStorage.getItem('dip_stations')  || '[]'); }
function getEmployees() { return JSON.parse(localStorage.getItem('dip_employees') || '[]'); }
function getLogs()      { return JSON.parse(localStorage.getItem('dip_logs')      || '[]'); }
function saveLogs(arr)  { localStorage.setItem('dip_logs', JSON.stringify(arr)); }

function getStationStatus() { return JSON.parse(localStorage.getItem('dip_station_status') || '[]'); }
function saveStationStatus(arr) { localStorage.setItem('dip_station_status', JSON.stringify(arr)); }

// ── 驗證員工 ──
function validateEmployee(id) {
  const emps = getEmployees();
  if (!emps.length) return { valid: true, emp: { id, name: id, role:'operator', enabled:true } }; // 無設定時不擋
  const emp = emps.find(e => e.id.toLowerCase() === id.toLowerCase() && e.enabled);
  return emp ? { valid: true, emp } : { valid: false };
}

// ── 驗證工站 ──
function validateStation(id) {
  const stations = getStations();
  if (!stations.length) return { valid: true, station: { id, name: id, enabled: true } };
  const st = stations.find(s => s.id.toLowerCase() === id.toLowerCase() && s.enabled);
  return st ? { valid: true, station: st } : { valid: false };
}

// ── 初始化 ──
function init() {
  setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleString('zh-TW'); }, 1000);
  const stations = getStations(), emps = getEmployees();
  if (!stations.length || !emps.length) document.getElementById('no-config-warn').style.display='block';
  buildLog();
}

// ── 步驟導航 ──
function goStep(n) {
  ['step0','step1','step2','step3','step4'].forEach((id,i) => {
    document.getElementById(id).style.display = i === n ? '' : 'none';
  });
  ['ss0','ss1','ss2','ss3'].forEach((id,i) => {
    document.getElementById(id).className = 'step-seg' + (i<n?' done':i===n?' active':'');
  });
  document.getElementById('headerStep').textContent = n < 4 ? `步驟 ${n+1} / 4` : '完成';
  if (n === 3) buildConfirm();
  if (n === 4) buildLog();
}

// ── Step 0: Employee ──
function handleEmpKey(e) { if(e.key==='Enter'){e.preventDefault();confirmEmp('scan');} }
function handleExtraKey(e) { if(e.key==='Enter'){e.preventDefault();addExtra('scan');} }

function confirmEmp(method) {
  const v = document.getElementById('empIn').value.trim();
  if (!v) return;
  if (S.workers.find(w => w.id.toLowerCase() === v.toLowerCase())) {
    showErr('empErr', '此員工已在列表中'); return;
  }
  const result = validateEmployee(v);
  if (!result.valid) { showErr('empErr', `找不到員工：${v}，請確認編號是否正確`); return; }
  hideErr('empErr');
  if (S.workers.length === 0) {
    S.workers.push({ id: result.emp.id, name: result.emp.name, method, role: result.emp.role || 'operator' });
    document.getElementById('empIn').value = '';
    document.getElementById('addSection').style.display = '';
    document.getElementById('btnEmpNext').disabled = false;
    renderWorkers();
    setBoxFilled('empBox','👤', result.emp.name + '（' + result.emp.id + '）', method);
  }
}

function addExtra(method) {
  const inp = document.getElementById('extraIn');
  const v = inp.value.trim(); if (!v) return;
  if (S.workers.find(w => w.id.toLowerCase() === v.toLowerCase())) {
    showErr('empErr','此員工已在列表中'); return;
  }
  const result = validateEmployee(v);
  if (!result.valid) { showErr('empErr', `找不到員工：${v}`); return; }
  hideErr('empErr');
  S.workers.push({ id: result.emp.id, name: result.emp.name, method, role: 'support' });
  inp.value = '';
  renderWorkers();
}

function removeWorker(id) {
  S.workers = S.workers.filter(w => w.id !== id);
  if (!S.workers.length) {
    document.getElementById('addSection').style.display = 'none';
    document.getElementById('btnEmpNext').disabled = true;
    resetBox('empBox','👤','點此掃碼或輸入員工編號');
  }
  renderWorkers();
}

function renderWorkers() {
  document.getElementById('workersList').innerHTML = S.workers.map((w,i) => `
    <div class="worker-chip">
      <div class="w-avatar">${w.name.slice(-1)}</div>
      <span class="w-name">${w.name}（${w.id}）</span>
      <span class="badge badge-${w.method}">${w.method==='scan'?'掃碼':'手動'}</span>
      <span class="badge badge-${i===0?'op':'sup'}">${i===0?'操作員':'支援'}</span>
      <button class="w-rm" onclick="removeWorker('${w.id}')">×</button>
    </div>`).join('');
}

// ── Step 1: Station ──
function handleStKey(e) { if(e.key==='Enter'){e.preventDefault();confirmStation('scan');} }
function confirmStation(method) {
  const v = document.getElementById('stIn').value.trim(); if (!v) return;
  const result = validateStation(v);
  if (!result.valid) { showErr('stErr', `找不到工站：${v}，請確認後再試或聯絡管理員`); return; }
  hideErr('stErr');
  S.station = result.station.id;
  S.stationName = result.station.name;
  S.stationMethod = method;
  document.getElementById('stIn').value = '';
  setBoxFilled('stBox','🏭', result.station.name + '（' + result.station.id + '）', method);
  document.getElementById('btnStNext').disabled = false;
}

// ── Step 2: Work Order ──
function handleWoKey(e) { if(e.key==='Enter'){e.preventDefault();confirmWo('scan');} }
function confirmWo(method) {
  const v = document.getElementById('woIn').value.trim(); if (!v) return;
  S.order = v; S.orderMethod = method;
  document.getElementById('woIn').value = '';
  setBoxFilled('woBox','📋', v, method);
  document.getElementById('btnWoNext').disabled = false;
}

// ── Step 3: Confirm ──
function buildConfirm() {
  const wRows = S.workers.map((w,i) => `
    <span class="confirm-chip">${w.name}</span>
    <span class="badge badge-${w.method}">${w.method==='scan'?'掃碼':'手動'}</span>
    <span class="badge badge-${i===0?'op':'sup'}">${i===0?'操作員':'支援'}</span>`).join('');
  document.getElementById('confirmCard').innerHTML = `
    <div class="confirm-row"><span class="confirm-key">員工</span><div class="confirm-vals">${wRows}</div></div>
    <div class="confirm-row"><span class="confirm-key">工站</span><div class="confirm-vals">
      <span class="confirm-chip">${S.stationName}（${S.station}）</span>
      <span class="badge badge-${S.stationMethod}">${S.stationMethod==='scan'?'掃碼':'手動'}</span></div></div>
    <div class="confirm-row"><span class="confirm-key">工單</span><div class="confirm-vals">
      <span class="confirm-chip">${S.order}</span>
      <span class="badge badge-${S.orderMethod}">${S.orderMethod==='scan'?'掃碼':'手動'}</span></div></div>
    <div class="confirm-row"><span class="confirm-key">時間</span><div class="confirm-vals">
      <span style="font-size:13px;font-family:'JetBrains Mono',monospace">${new Date().toLocaleString('zh-TW')}</span></div></div>`;
}

// ── Step 4: Submit ──
function submitRecord() {
  const now = new Date();
  const record = {
    id: 'R' + now.getTime(),
    ts: now.toISOString(),
    workers: S.workers.map((w,i) => ({ empId:w.id, empName:w.name, method:w.method, role:i===0?'operator':'support' })),
    stationId: S.station, stationName: S.stationName, stationMethod: S.stationMethod,
    workOrderId: S.order, orderMethod: S.orderMethod
  };
  const logs = getLogs();
  logs.unshift(record);
  saveLogs(logs.slice(0, 200));

  // 更新工站在線狀態
  const status = getStationStatus();
  const idx = status.findIndex(s => s.stationId === S.station);
  const ops = S.workers.map((w,i) => ({
    empId: w.id, empName: w.name, role: i===0?'operator':'support',
    since: now.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})
  }));
  if (idx >= 0) status[idx].operators = ops;
  else status.push({ stationId: S.station, stationName: S.stationName, operators: ops });
  saveStationStatus(status);

  document.getElementById('savedId').textContent = 'ID: ' + record.id;
  goStep(4);
}

// ── Log ──
function buildLog() {
  const logs = getLogs().filter(r => r.ts.startsWith(new Date().toISOString().slice(0,10)));
  const el = document.getElementById('logList');
  if (!logs.length) { el.innerHTML='<div style="font-size:13px;color:var(--text3);text-align:center;padding:16px">今日尚無記錄</div>'; return; }
  el.innerHTML = logs.slice(0,10).map(r => {
    const hasManual = r.workers.some(w=>w.method==='manual')||r.stationMethod==='manual'||r.orderMethod==='manual';
    return `<div class="log-item">
      <div class="log-dot"></div>
      <div class="log-main">
        <div class="log-title">${r.stationName} → ${r.workOrderId}</div>
        <div class="log-sub">${r.workers.map(w=>w.empName).join(', ')}</div>
      </div>
      <div class="log-time">
        <div>${new Date(r.ts).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})}</div>
        <div style="margin-top:3px">${hasManual?'<span class="badge badge-manual">含手動</span>':'<span class="badge badge-scan">全掃碼</span>'}</div>
      </div>
    </div>`;
  }).join('');
}

function clearLog() {
  if (confirm('確定清除所有記錄？')) { localStorage.removeItem('dip_logs'); buildLog(); }
}

function resetFlow() {
  Object.assign(S, {workers:[], station:null, stationName:null, stationMethod:null, order:null, orderMethod:null});
  document.getElementById('empIn').value='';
  document.getElementById('stIn').value='';
  document.getElementById('woIn').value='';
  document.getElementById('workersList').innerHTML='';
  document.getElementById('addSection').style.display='none';
  document.getElementById('btnEmpNext').disabled=true;
  document.getElementById('btnStNext').disabled=true;
  document.getElementById('btnWoNext').disabled=true;
  hideErr('empErr'); hideErr('stErr');
  resetBox('empBox','👤','點此掃碼或輸入員工編號');
  resetBox('stBox','🏭','點此掃描工站 QR Code');
  resetBox('woBox','📋','點此掃描工單條碼');
  goStep(0);
}

function setBoxFilled(id, ico, val, method) {
  const box = document.getElementById(id);
  box.className='scan-target filled';
  box.onclick=null;
  box.innerHTML=`<span class="scan-ico">${ico}</span><span class="scan-val">${val}</span><span class="badge badge-${method}">${method==='scan'?'掃碼':'手動'}</span>`;
}
function resetBox(id, ico, ph) {
  const box = document.getElementById(id);
  box.className='scan-target';
  if(id==='empBox') box.onclick=()=>document.getElementById('empIn').focus();
  if(id==='stBox')  box.onclick=()=>document.getElementById('stIn').focus();
  if(id==='woBox')  box.onclick=()=>document.getElementById('woIn').focus();
  box.innerHTML=`<span class="scan-ico">${ico}</span><span class="scan-ph">${ph}</span>`;
}
function showErr(id, msg) { const el=document.getElementById(id); el.style.display=''; el.textContent=msg; }
function hideErr(id) { document.getElementById(id).style.display='none'; }

init();
</script>
</body>
</html>
