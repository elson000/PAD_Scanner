<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a0f">
<title>條碼掃描器</title>
<link rel="manifest" href="manifest.json">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg:#0a0a0f; --surface:#13131a; --surface2:#1c1c26;
  --border:rgba(255,255,255,0.08); --accent:#4fc3f7; --accent2:#7c4dff;
  --text:#f0f0ff; --muted:rgba(240,240,255,0.45);
  --success:#4caf93; --radius:16px;
}
body { background:var(--bg); color:var(--text); font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif; min-height:100dvh; display:flex; flex-direction:column; overflow-x:hidden; }
header { padding:14px 18px 12px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); background:var(--surface); }
.logo { font-size:17px; font-weight:700; background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.tabs { display:flex; gap:4px; padding:10px 14px; background:var(--surface); border-bottom:1px solid var(--border); }
.tab { flex:1; padding:8px 0; border-radius:10px; border:none; background:transparent; color:var(--muted); font-size:13px; font-weight:500; cursor:pointer; font-family:inherit; }
.tab.active { background:var(--surface2); color:var(--accent); border:1px solid rgba(79,195,247,0.25); }
.scanner-area { flex:1; display:flex; flex-direction:column; align-items:center; padding:16px 14px; gap:14px; }
.viewfinder-wrap { width:100%; max-width:420px; position:relative; border-radius:var(--radius); overflow:hidden; background:#000; aspect-ratio:1/1; }
#video { width:100%; height:100%; object-fit:cover; display:block; }
.scan-overlay { position:absolute; inset:0; pointer-events:none; }
.corner { position:absolute; width:28px; height:28px; border-color:var(--accent); border-style:solid; border-width:0; }
.corner.tl { top:14px; left:14px; border-top-width:3px; border-left-width:3px; border-top-left-radius:4px; }
.corner.tr { top:14px; right:14px; border-top-width:3px; border-right-width:3px; border-top-right-radius:4px; }
.corner.bl { bottom:14px; left:14px; border-bottom-width:3px; border-left-width:3px; border-bottom-left-radius:4px; }
.corner.br { bottom:14px; right:14px; border-bottom-width:3px; border-right-width:3px; border-bottom-right-radius:4px; }
.scan-line { position:absolute; left:14px; right:14px; height:2px; background:linear-gradient(90deg,transparent,var(--accent),transparent); animation:scanMove 2s ease-in-out infinite; }
@keyframes scanMove { 0%{top:14px;opacity:.8} 50%{opacity:1} 100%{top:calc(100% - 16px);opacity:.8} }
.beep-ind { position:absolute; inset:0; background:rgba(79,195,247,.18); border-radius:var(--radius); pointer-events:none; opacity:0; transition:opacity .1s; }
.torch-btn { position:absolute; bottom:12px; right:12px; width:40px; height:40px; border-radius:50%; background:rgba(0,0,0,.6); border:1px solid rgba(255,255,255,.2); color:#fff; font-size:18px; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:10; }
.torch-btn.on { background:rgba(255,200,0,.3); border-color:rgba(255,200,0,.6); color:#ffc800; }
.cam-placeholder { width:100%; max-width:420px; aspect-ratio:1/1; border-radius:var(--radius); background:var(--surface2); border:1px solid var(--border); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:var(--muted); font-size:14px; text-align:center; padding:28px; }
.cam-icon { font-size:44px; opacity:.4; }
.debug-bar { width:100%; max-width:420px; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:8px 12px; font-size:11px; color:var(--muted); font-family:monospace; min-height:32px; line-height:1.6; word-break:break-all; }
.result-card { width:100%; max-width:420px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
.result-header { padding:9px 13px; background:var(--surface2); display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); border-bottom:1px solid var(--border); }
.result-type-badge { background:rgba(79,195,247,.12); color:var(--accent); padding:2px 8px; border-radius:6px; font-size:11px; font-weight:600; }
.result-body { padding:13px; }
.result-text { font-size:15px; word-break:break-all; line-height:1.5; }
.result-actions { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
.btn-sm { padding:6px 14px; border-radius:8px; border:1px solid var(--border); background:var(--surface2); color:var(--text); font-size:12px; cursor:pointer; font-family:inherit; }
.btn-sm:active { opacity:.7; }
.btn-sm.primary { background:rgba(79,195,247,.12); border-color:rgba(79,195,247,.3); color:var(--accent); }
.btn-main { width:100%; max-width:420px; padding:14px; border-radius:var(--radius); border:none; background:linear-gradient(135deg,#2979ff,var(--accent2)); color:#fff; font-size:15px; font-weight:600; cursor:pointer; font-family:inherit; }
.btn-main:active { opacity:.85; }
.btn-main:disabled { opacity:.4; cursor:not-allowed; }
.btn-main.stop { background:linear-gradient(135deg,#c62828,#e53935); }
.page { display:none; flex-direction:column; flex:1; }
.page.active { display:flex; }
.history-section { flex:1; padding:14px; overflow-y:auto; }
.history-empty { text-align:center; color:var(--muted); font-size:14px; padding:44px 20px; }
.history-item { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:11px 13px; margin-bottom:10px; cursor:pointer; }
.hi-top { display:flex; align-items:center; gap:8px; margin-bottom:5px; }
.hi-badge { background:var(--surface2); color:var(--muted); padding:2px 7px; border-radius:5px; font-size:10px; font-weight:600; }
.hi-time { font-size:11px; color:var(--muted); margin-left:auto; }
.hi-text { font-size:13px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.flash { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(76,175,147,.95); color:#fff; padding:10px 22px; border-radius:12px; font-size:14px; font-weight:600; pointer-events:none; z-index:999; opacity:0; transition:opacity .25s; }
.hidden { display:none !important; }
</style>
</head>
<body>

<header>
  <span class="logo">掃描器 PWA</span>
  <span style="font-size:11px;color:var(--muted);">免安裝</span>
</header>

<div class="tabs">
  <button class="tab active" onclick="switchPage('scan',this)">📷 掃描</button>
  <button class="tab" onclick="switchPage('history',this)">📋 記錄</button>
</div>

<div class="page active" id="page-scan">
  <div class="scanner-area">

    <div id="viewfinder-wrap" class="viewfinder-wrap hidden">
      <video id="video" playsinline autoplay muted></video>
      <div class="scan-overlay">
        <div class="corner tl"></div><div class="corner tr"></div>
        <div class="corner bl"></div><div class="corner br"></div>
        <div class="scan-line"></div>
        <div class="beep-ind" id="beepInd"></div>
      </div>
      <div class="torch-btn hidden" id="torchBtn" onclick="toggleTorch()">💡</div>
    </div>

    <div id="camPlaceholder" class="cam-placeholder">
      <div class="cam-icon">📷</div>
      <div style="font-size:15px;color:var(--text);font-weight:500;">按下啟動掃描</div>
      <div style="font-size:12px;">支援 QR Code、EAN、Code128 等</div>
    </div>

    <div class="debug-bar" id="debugBar">狀態：等待啟動</div>

    <div class="result-card">
      <div class="result-header">
        <span>掃描結果</span>
        <span class="result-type-badge" id="resultType">等待中</span>
        <span style="margin-left:auto;font-size:11px;" id="resultTime"></span>
      </div>
      <div class="result-body">
        <div class="result-text" id="resultText" style="color:var(--muted);">尚未掃描任何條碼</div>
        <div class="result-actions" id="resultActions" style="display:none;">
          <button class="btn-sm primary" onclick="copyResult()">複製</button>
          <button class="btn-sm" id="openLinkBtn" onclick="openResult()" style="display:none;">開啟連結</button>
          <button class="btn-sm" onclick="shareResult()">分享</button>
          <button class="btn-sm" onclick="clearResult()">清除</button>
        </div>
      </div>
    </div>

    <button class="btn-main" id="mainBtn" onclick="toggleScan()">啟動相機掃描</button>

  </div>
</div>

<div class="page" id="page-history">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:13px 14px 4px;">
    <span style="font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;">掃描記錄</span>
    <button class="btn-sm" onclick="clearHistory()">清除全部</button>
  </div>
  <div class="history-section" id="historyList"></div>
</div>

<div class="flash" id="flashMsg"></div>
<canvas id="cap" style="display:none;"></canvas>

<script>
// ── 狀態 ──────────────────────────────────────────
let scanning = false;
let currentStream = null;
let torchOn = false;
let torchTrack = null;
let lastResult = null;
let rafId = null;
let history = [];
try { history = JSON.parse(localStorage.getItem('scanHistory') || '[]'); } catch(e){}

const video = document.getElementById('video');
const cap = document.getElementById('cap');
const ctx = cap.getContext('2d', { willReadFrequently: true });

function dbg(msg) {
  document.getElementById('debugBar').textContent = '狀態：' + msg;
  console.log('[Scanner]', msg);
}

// ── 頁面切換 ──────────────────────────────────────
function switchPage(page, el) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  el.classList.add('active');
  if (page === 'history') renderHistory();
}

// ── 主控制 ────────────────────────────────────────
async function toggleScan() {
  if (scanning) { stopScan(); return; }
  await startScan();
}

async function startScan() {
  const btn = document.getElementById('mainBtn');
  btn.disabled = true;
  btn.textContent = '啟動中…';
  dbg('請求相機權限…');

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    });

    currentStream = stream;
    video.srcObject = stream;
    video.setAttribute('playsinline', true);

    await new Promise((res, rej) => {
      video.onloadedmetadata = res;
      video.onerror = rej;
      setTimeout(res, 3000); // fallback
    });

    await video.play();
    dbg('相機啟動，影像：' + video.videoWidth + 'x' + video.videoHeight);

    // Torch
    const [track] = stream.getVideoTracks();
    torchTrack = track;
    try {
      const caps = track.getCapabilities ? track.getCapabilities() : {};
      if (caps.torch) document.getElementById('torchBtn').classList.remove('hidden');
    } catch(e){}

    showViewfinder();
    startDetecting();

  } catch(e) {
    dbg('錯誤：' + (e.name || e.message));
    btn.disabled = false;
    btn.textContent = '啟動相機掃描';
    if (e.name === 'NotAllowedError') alert('請允許相機權限後再試');
    else if (e.name === 'NotFoundError') alert('找不到相機裝置');
    else alert('相機啟動失敗：' + e.message);
  }
}

function showViewfinder() {
  scanning = true;
  document.getElementById('camPlaceholder').classList.add('hidden');
  document.getElementById('viewfinder-wrap').classList.remove('hidden');
  const btn = document.getElementById('mainBtn');
  btn.disabled = false;
  btn.textContent = '停止掃描';
  btn.classList.add('stop');
}

function stopScan() {
  scanning = false;
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  if (currentStream) { currentStream.getTracks().forEach(t => t.stop()); currentStream = null; }
  torchTrack = null; torchOn = false;
  document.getElementById('torchBtn').classList.add('hidden');
  document.getElementById('torchBtn').classList.remove('on');
  document.getElementById('viewfinder-wrap').classList.add('hidden');
  document.getElementById('camPlaceholder').classList.remove('hidden');
  const btn = document.getElementById('mainBtn');
  btn.disabled = false;
  btn.textContent = '啟動相機掃描';
  btn.classList.remove('stop');
  dbg('已停止');
}

// ── 偵測邏輯：優先 BarcodeDetector，備用 Canvas+BarcodeDetector ──
let detector = null;
let frameCount = 0;

async function startDetecting() {
  // 建立 detector
  if ('BarcodeDetector' in window) {
    try {
      let fmts = ['qr_code','ean_13','ean_8','code_128','code_39','data_matrix','pdf417','aztec','upc_a','upc_e','itf'];
      try {
        const sup = await BarcodeDetector.getSupportedFormats();
        if (sup && sup.length) fmts = sup;
      } catch(e){}
      detector = new BarcodeDetector({ formats: fmts });
      dbg('BarcodeDetector 就緒，格式：' + fmts.length + ' 種，掃描中…');
    } catch(e) {
      detector = null;
      dbg('BarcodeDetector 建立失敗，改用 Canvas 模式');
    }
  } else {
    dbg('瀏覽器不支援 BarcodeDetector，嘗試 Canvas 模式…');
  }

  frameCount = 0;
  detectLoop();
}

async function detectLoop() {
  if (!scanning) return;
  frameCount++;

  if (video.readyState >= 2 && video.videoWidth > 0) {
    // 每 6 幀偵測一次（約 10fps on 60fps screen）
    if (frameCount % 6 === 0) {
      await tryDetect();
    }
  }

  rafId = requestAnimationFrame(detectLoop);
}

async function tryDetect() {
  try {
    if (detector) {
      // 方法 A：直接從 video element 偵測
      const codes = await detector.detect(video);
      if (codes.length > 0) {
        handleResult(codes[0].rawValue, codes[0].format);
        return;
      }

      // 方法 B：先畫到 canvas 再偵測（部分裝置需要）
      cap.width = video.videoWidth;
      cap.height = video.videoHeight;
      ctx.drawImage(video, 0, 0);
      const codes2 = await detector.detect(cap);
      if (codes2.length > 0) {
        handleResult(codes2[0].rawValue, codes2[0].format);
        return;
      }
    }
  } catch(e) {
    // 靜默失敗，繼續偵測
  }
}

// ── 結果處理 ──────────────────────────────────────
function handleResult(text, format) {
  if (text === lastResult) return;
  lastResult = text;

  const ind = document.getElementById('beepInd');
  ind.style.opacity = '1';
  setTimeout(() => ind.style.opacity = '0', 200);
  try { navigator.vibrate && navigator.vibrate(50); } catch(e){}

  const now = new Date();
  const entry = { text, format: String(format || 'QR_CODE'), time: now.toISOString() };
  history.unshift(entry);
  if (history.length > 50) history = history.slice(0, 50);
  try { localStorage.setItem('scanHistory', JSON.stringify(history)); } catch(e){}

  showResult(text, format, now);
  stopScan();
  dbg('✅ 掃描成功：' + String(format));
}

function showResult(text, format, date) {
  document.getElementById('resultType').textContent = fmtLabel(String(format || ''));
  document.getElementById('resultText').textContent = text;
  document.getElementById('resultText').style.color = 'var(--text)';
  document.getElementById('resultTime').textContent = date ? timeStr(date) : '';
  document.getElementById('resultActions').style.display = 'flex';
  document.getElementById('openLinkBtn').style.display = /^https?:\/\//i.test(text) ? 'inline-flex' : 'none';
}

function fmtLabel(fmt) {
  const m = { QR_CODE:'QR Code', qr_code:'QR Code', EAN_13:'EAN-13', ean_13:'EAN-13', EAN_8:'EAN-8', ean_8:'EAN-8', CODE_128:'Code 128', code_128:'Code 128', CODE_39:'Code 39', code_39:'Code 39', DATA_MATRIX:'Data Matrix', data_matrix:'Data Matrix', PDF_417:'PDF417', pdf417:'PDF417', AZTEC:'Aztec', aztec:'Aztec', UPC_A:'UPC-A', upc_a:'UPC-A', UPC_E:'UPC-E', upc_e:'UPC-E', ITF:'ITF', itf:'ITF' };
  return m[fmt] || fmt || '條碼';
}

function timeStr(d) { return d.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); }

function copyResult() {
  const t = document.getElementById('resultText').textContent;
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(()=>flash('已複製！')).catch(()=>fallbackCopy(t));
  else fallbackCopy(t);
}
function fallbackCopy(t) {
  const ta = document.createElement('textarea'); ta.value = t;
  document.body.appendChild(ta); ta.select(); document.execCommand('copy');
  document.body.removeChild(ta); flash('已複製！');
}
function openResult() { window.open(document.getElementById('resultText').textContent,'_blank'); }
function shareResult() {
  const t = document.getElementById('resultText').textContent;
  if (navigator.share) navigator.share({title:'掃描結果',text:t}); else copyResult();
}
function clearResult() {
  lastResult = null;
  document.getElementById('resultType').textContent = '等待中';
  document.getElementById('resultText').textContent = '尚未掃描任何條碼';
  document.getElementById('resultText').style.color = 'var(--muted)';
  document.getElementById('resultActions').style.display = 'none';
  document.getElementById('resultTime').textContent = '';
}

async function toggleTorch() {
  if (!torchTrack) return;
  torchOn = !torchOn;
  try { await torchTrack.applyConstraints({advanced:[{torch:torchOn}]}); document.getElementById('torchBtn').classList.toggle('on',torchOn); }
  catch(e) { flash('手電筒不支援'); torchOn=false; }
}

function flash(msg) {
  const el = document.getElementById('flashMsg');
  el.textContent = msg; el.style.opacity = '1';
  setTimeout(()=>el.style.opacity='0', 1400);
}

function renderHistory() {
  const c = document.getElementById('historyList');
  if (!history.length) { c.innerHTML = '<div class="history-empty">尚無記錄<br><span style="font-size:12px;">掃描後自動儲存</span></div>'; return; }
  c.innerHTML = history.map((item,i) => `
    <div class="history-item" onclick="useHistory(${i})">
      <div class="hi-top">
        <span class="hi-badge">${fmtLabel(item.format)}</span>
        <span class="hi-time">${new Date(item.time).toLocaleDateString('zh-TW')} ${timeStr(new Date(item.time))}</span>
      </div>
      <div class="hi-text">${esc(item.text)}</div>
    </div>`).join('');
}

function useHistory(i) {
  const item = history[i];
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-scan').classList.add('active');
  document.querySelectorAll('.tab')[0].classList.add('active');
  showResult(item.text, item.format, new Date(item.time));
}

function clearHistory() {
  history=[]; try{localStorage.setItem('scanHistory','[]');}catch(e){}
  renderHistory(); flash('記錄已清除');
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
</html>
