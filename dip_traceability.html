<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f0f12">
<title>DIP 追溯系統</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap');
:root {
  --bg:#0f0f12;--bg2:#17171c;--bg3:#1e1e26;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);
  --text:#f0f0f5;--text2:#9090a8;--text3:#5a5a70;
  --green:#2ecc8a;--green-bg:rgba(46,204,138,0.1);--green-border:rgba(46,204,138,0.25);
  --purple:#8b7ff0;--purple-bg:rgba(139,127,240,0.1);--purple-border:rgba(139,127,240,0.25);
  --amber:#f0b429;--amber-bg:rgba(240,180,41,0.1);
  --red:#f05252;
  --radius:10px;--radius-lg:14px;
  --mono:'IBM Plex Mono',monospace;--sans:'Noto Sans TC',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans)}
body{display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}

.header{width:100%;max-width:480px;padding:16px 20px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:0.5px solid var(--border)}
.header-logo{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--green);letter-spacing:.05em}
.header-title{font-size:12px;color:var(--text3);font-family:var(--mono)}

.progress-wrap{width:100%;max-width:480px;padding:14px 20px 0}
.step-labels{display:flex;justify-content:space-between;margin-bottom:8px}
.step-label{font-size:10px;font-family:var(--mono);color:var(--text3);transition:color .3s}
.step-label.active{color:var(--purple)}.step-label.done{color:var(--green)}
.step-bar{display:flex;gap:4px;margin-bottom:16px}
.step-seg{flex:1;height:3px;border-radius:2px;background:var(--bg3);transition:background .4s}
.step-seg.done{background:var(--green)}.step-seg.active{background:var(--purple)}

.main{width:100%;max-width:480px;padding:0 20px 24px;flex:1}
.page{display:none;animation:fadeIn .2s ease}.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.screen-title{font-size:18px;font-weight:700;margin-bottom:4px;letter-spacing:-.01em}
.screen-sub{font-size:13px;color:var(--text2);margin-bottom:18px;font-family:var(--mono)}

.card{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-bottom:12px}
.card-label{font-size:10px;font-family:var(--mono);color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}

/* Camera overlay - fullscreen */
.cam-overlay{display:none;position:fixed;inset:0;background:#000;z-index:1000;flex-direction:column}
.cam-overlay.open{display:flex}
.cam-header{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,0.8);flex-shrink:0}
.cam-label-text{font-family:var(--mono);font-size:13px;font-weight:600;color:#fff}
.cam-close{background:rgba(255,255,255,0.12);border:none;border-radius:8px;color:#fff;font-size:18px;width:36px;height:36px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:var(--mono)}
.cam-video-wrap{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
#camVideo{width:100%;height:100%;object-fit:cover;display:block}
/* scan frame corners */
.scan-frame{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center}
.scan-box{position:relative;width:240px;height:240px}
.scan-box::before{content:'';position:absolute;inset:0;box-shadow:0 0 0 9999px rgba(0,0,0,0.5)}
.corner{position:absolute;width:28px;height:28px;border-color:var(--green);border-style:solid;border-width:0}
.corner.tl{top:0;left:0;border-top-width:3px;border-left-width:3px;border-top-left-radius:4px}
.corner.tr{top:0;right:0;border-top-width:3px;border-right-width:3px;border-top-right-radius:4px}
.corner.bl{bottom:0;left:0;border-bottom-width:3px;border-left-width:3px;border-bottom-left-radius:4px}
.corner.br{bottom:0;right:0;border-bottom-width:3px;border-right-width:3px;border-bottom-right-radius:4px}
.scan-line{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--green),transparent);animation:scanMove 2s ease-in-out infinite}
@keyframes scanMove{0%{top:0;opacity:.8}50%{opacity:1}100%{top:calc(100% - 2px);opacity:.8}}
.cam-flash{position:absolute;inset:0;background:rgba(46,204,138,0.3);display:none;align-items:center;justify-content:center;font-size:64px}

.cam-status{font-family:var(--mono);font-size:12px;color:rgba(255,255,255,0.5);text-align:center;padding:12px 20px 8px;background:rgba(0,0,0,0.8);flex-shrink:0}
.cam-footer{padding:10px 20px 20px;background:rgba(0,0,0,0.8);flex-shrink:0;display:flex;gap:8px}
.cam-manual-btn{flex:1;background:rgba(255,255,255,0.08);border:0.5px solid rgba(255,255,255,0.2);border-radius:var(--radius);color:#fff;font-family:var(--mono);font-size:13px;padding:11px;cursor:pointer}
.cam-torch-btn{background:rgba(255,200,0,0.1);border:0.5px solid rgba(255,200,0,0.3);border-radius:var(--radius);color:#ffc800;font-size:18px;padding:11px 16px;cursor:pointer;display:none}
.cam-torch-btn.visible{display:block}
.cam-torch-btn.on{background:rgba(255,200,0,0.25)}

/* Scan target box */
.scan-target{border:1.5px dashed var(--border2);border-radius:var(--radius);padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:border-color .2s,background .2s;min-height:54px;margin-bottom:10px;background:var(--bg3)}
.scan-target.filled{border-style:solid;border-color:var(--green-border);background:var(--green-bg)}
.scan-ico{font-size:22px;flex-shrink:0;opacity:.5}.scan-target.filled .scan-ico{opacity:1}
.scan-ph{font-size:13px;color:var(--text3);font-family:var(--mono)}
.scan-val{font-size:15px;font-weight:600;color:var(--green);font-family:var(--mono);flex:1}

.badge{font-size:10px;font-family:var(--mono);padding:3px 8px;border-radius:20px;flex-shrink:0}
.badge-camera{background:var(--purple-bg);color:var(--purple);border:0.5px solid var(--purple-border)}
.badge-scan{background:var(--green-bg);color:var(--green);border:0.5px solid var(--green-border)}
.badge-manual{background:var(--amber-bg);color:var(--amber);border:0.5px solid rgba(240,180,41,0.3)}

/* Camera button */
.btn-camera{display:flex;align-items:center;gap:8px;width:100%;background:var(--purple-bg);border:0.5px solid var(--purple-border);border-radius:var(--radius);color:var(--purple);font-family:var(--mono);font-size:13px;font-weight:600;padding:12px 14px;cursor:pointer;transition:background .15s;margin-bottom:8px}
.btn-camera:hover{background:rgba(139,127,240,0.18)}
.btn-camera svg{flex-shrink:0}

input[type=text]{flex:1;background:var(--bg3);border:0.5px solid var(--border2);border-radius:var(--radius);color:var(--text);font-size:14px;font-family:var(--mono);padding:10px 14px;outline:none;transition:border-color .2s;min-width:0}
input[type=text]:focus{border-color:var(--purple)}
input[type=text]::placeholder{color:var(--text3)}

.input-row{display:flex;gap:8px}
.btn{background:transparent;border:0.5px solid var(--border2);border-radius:var(--radius);color:var(--text2);font-family:var(--mono);font-size:13px;padding:10px 16px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.btn:hover{background:var(--bg3);color:var(--text)}
.btn-primary{width:100%;background:var(--purple);border:none;border-radius:var(--radius);color:#fff;font-family:var(--mono);font-size:14px;font-weight:600;padding:14px;cursor:pointer;letter-spacing:.04em;transition:background .15s,transform .1s;margin-top:6px}
.btn-primary:hover{background:#7a6ee0}.btn-primary:active{transform:scale(.98)}
.btn-primary:disabled{background:var(--bg3);color:var(--text3);cursor:default;transform:none}
.btn-back{background:transparent;border:0.5px solid var(--border);border-radius:var(--radius);color:var(--text3);font-family:var(--mono);font-size:13px;padding:14px 16px;cursor:pointer;flex-shrink:0}
.action-row{display:flex;gap:8px;margin-top:6px}
.action-row .btn-primary{margin-top:0}

.workers-list{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.worker-chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg3);border:0.5px solid var(--border2);border-radius:20px;padding:5px 8px 5px 6px}
.worker-av{width:24px;height:24px;border-radius:50%;background:var(--purple-bg);border:0.5px solid var(--purple-border);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--purple);font-family:var(--mono);flex-shrink:0}
.worker-name{font-family:var(--mono);font-size:13px;color:var(--text)}
.worker-rm{background:none;border:none;cursor:pointer;color:var(--text3);font-size:16px;padding:0 2px;line-height:1;transition:color .15s}
.worker-rm:hover{color:var(--red)}
.divider{height:0.5px;background:var(--border);margin:12px 0}
.notice{font-size:12px;font-family:var(--mono);color:var(--text3);background:var(--bg3);border-left:2px solid var(--purple);border-radius:0 var(--radius) var(--radius) 0;padding:10px 12px;margin-bottom:14px;line-height:1.7}
.scan-hint{font-size:11px;font-family:var(--mono);color:var(--text3);margin-top:6px;padding-left:2px}
.scan-hint span{color:var(--purple)}
.add-worker-section{display:none;margin-top:10px}
.add-worker-section.visible{display:block}

.confirm-row{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 0;border-bottom:0.5px solid var(--border)}
.confirm-row:last-child{border-bottom:none}
.confirm-key{font-size:11px;font-family:var(--mono);color:var(--text3);text-transform:uppercase;letter-spacing:.06em;padding-top:2px;flex-shrink:0;min-width:56px}
.confirm-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.confirm-val-sm{font-family:var(--mono);font-size:13px;color:var(--text)}
.confirm-val{font-family:var(--mono);font-size:12px;color:var(--text);text-align:right}

.success-wrap{text-align:center;padding:32px 0 20px}
.success-icon{width:64px;height:64px;border-radius:50%;background:var(--green-bg);border:1.5px solid var(--green-border);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:28px}
.success-title{font-size:20px;font-weight:700;margin-bottom:6px}
.success-sub{font-size:13px;font-family:var(--mono);color:var(--text3);margin-bottom:24px}

.log-entry{padding:10px 0;border-bottom:0.5px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.log-entry:last-child{border-bottom:none}
.log-main{flex:1;min-width:0}
.log-order{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--text);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log-detail{font-size:12px;font-family:var(--mono);color:var(--text3)}
.log-right{text-align:right;flex-shrink:0}
.log-time{font-size:11px;font-family:var(--mono);color:var(--text3);margin-bottom:4px}
.log-empty{text-align:center;font-family:var(--mono);font-size:13px;color:var(--text3);padding:20px 0}
.log-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.log-title{font-size:13px;font-weight:600;font-family:var(--mono);color:var(--text2)}
.btn-clear{background:none;border:0.5px solid var(--border);border-radius:var(--radius);color:var(--text3);font-family:var(--mono);font-size:11px;padding:5px 12px;cursor:pointer;transition:color .15s,border-color .15s}
.btn-clear:hover{color:var(--red);border-color:rgba(240,82,82,0.4)}
</style>
</head>
<body>

<!-- ── Camera Overlay ── -->
<div class="cam-overlay" id="camOverlay">
  <div class="cam-header">
    <span class="cam-label-text" id="camLabelText">掃描條碼</span>
    <button class="cam-close" onclick="closeCamera()">✕</button>
  </div>
  <div class="cam-video-wrap">
    <video id="camVideo" playsinline autoplay muted></video>
    <div class="scan-frame">
      <div class="scan-box">
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
        <div class="scan-line"></div>
      </div>
    </div>
    <div class="cam-flash" id="camFlash">✓</div>
  </div>
  <div class="cam-status" id="camStatus">初始化相機中…</div>
  <div class="cam-footer">
    <button class="cam-torch-btn" id="torchBtn" onclick="toggleTorch()">💡</button>
    <button class="cam-manual-btn" onclick="closeCamera(); focusCurrentInput()">改用手動輸入</button>
  </div>
</div>

<!-- ── App Shell ── -->
<div class="header">
  <span class="header-logo">DIP · TRACE</span>
  <span class="header-title" id="headerStep">步驟 1 / 4</span>
</div>

<div class="progress-wrap">
  <div class="step-labels">
    <span class="step-label active" id="sl0">員工</span>
    <span class="step-label" id="sl1">工站</span>
    <span class="step-label" id="sl2">工單</span>
    <span class="step-label" id="sl3">確認</span>
  </div>
  <div class="step-bar">
    <div class="step-seg active" id="ss0"></div>
    <div class="step-seg" id="ss1"></div>
    <div class="step-seg" id="ss2"></div>
    <div class="step-seg" id="ss3"></div>
  </div>
</div>

<div class="main">

  <!-- Step 0: 員工 -->
  <div class="page active" id="page0">
    <div class="screen-title">員工登入</div>
    <div class="screen-sub">掃描員工 2D 條碼</div>
    <div class="notice">
      相機掃碼 → <b style="color:var(--purple)">camera</b>　外接掃碼器 Enter → <b style="color:var(--green)">scan</b>　手動確認 → <b style="color:var(--amber)">manual</b>
    </div>
    <div class="card">
      <div class="card-label">主要操作員</div>
      <button class="btn-camera" onclick="openCamera('emp')">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        開啟相機掃碼
      </button>
      <div class="scan-target" id="empBox" onclick="document.getElementById('empIn').focus()">
        <span class="scan-ico">👤</span>
        <span class="scan-ph">點此輸入員工編號</span>
      </div>
      <div class="input-row">
        <input type="text" id="empIn" placeholder="EMP-001" maxlength="20" onkeydown="if(event.key==='Enter'){event.preventDefault();confirmEmp('scan')}">
        <button class="btn" onclick="confirmEmp('manual')">確認</button>
      </div>
      <div class="scan-hint">外接掃碼器：輸入後按 <span>Enter</span></div>
      <div class="add-worker-section" id="addWorkerSection">
        <div class="divider"></div>
        <div class="card-label">在線員工</div>
        <div class="workers-list" id="workersList"></div>
        <div class="card-label" style="margin-top:8px">加派人員</div>
        <button class="btn-camera" onclick="openCamera('extra')" style="margin-bottom:8px">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          相機掃碼加入
        </button>
        <div class="input-row">
          <input type="text" id="extraIn" placeholder="加入員工編號" maxlength="20" onkeydown="if(event.key==='Enter'){event.preventDefault();addExtra('scan')}">
          <button class="btn" onclick="addExtra('manual')">加入</button>
        </div>
      </div>
    </div>
    <button class="btn-primary" id="btnEmpNext" disabled onclick="goStep(1)">下一步：掃工站 →</button>
  </div>

  <!-- Step 1: 工站 -->
  <div class="page" id="page1">
    <div class="screen-title">掃描工站</div>
    <div class="screen-sub">掃描工站 QR Code</div>
    <div class="card">
      <button class="btn-camera" onclick="openCamera('st')">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        開啟相機掃碼
      </button>
      <div class="scan-target" id="stBox" onclick="document.getElementById('stIn').focus()">
        <span class="scan-ico">🏭</span>
        <span class="scan-ph">點此輸入工站代碼</span>
      </div>
      <div class="input-row">
        <input type="text" id="stIn" placeholder="ST-A01" maxlength="20" onkeydown="if(event.key==='Enter'){event.preventDefault();confirmSt('scan')}">
        <button class="btn" onclick="confirmSt('manual')">確認</button>
      </div>
      <div class="scan-hint">外接掃碼器：輸入後按 <span>Enter</span></div>
    </div>
    <div class="action-row">
      <button class="btn-back" onclick="goStep(0)">←</button>
      <button class="btn-primary" id="btnStNext" disabled onclick="goStep(2)">下一步：掃工單 →</button>
    </div>
  </div>

  <!-- Step 2: 工單 -->
  <div class="page" id="page2">
    <div class="screen-title">掃描工單</div>
    <div class="screen-sub">掃描工單條碼</div>
    <div class="card">
      <button class="btn-camera" onclick="openCamera('wo')">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        開啟相機掃碼
      </button>
      <div class="scan-target" id="woBox" onclick="document.getElementById('woIn').focus()">
        <span class="scan-ico">📋</span>
        <span class="scan-ph">點此輸入工單號</span>
      </div>
      <div class="input-row">
        <input type="text" id="woIn" placeholder="WO-20240526-001" maxlength="30" onkeydown="if(event.key==='Enter'){event.preventDefault();confirmWo('scan')}">
        <button class="btn" onclick="confirmWo('manual')">確認</button>
      </div>
      <div class="scan-hint">外接掃碼器：輸入後按 <span>Enter</span></div>
    </div>
    <div class="action-row">
      <button class="btn-back" onclick="goStep(1)">←</button>
      <button class="btn-primary" id="btnWoNext" disabled onclick="goStep(3)">下一步：確認送出 →</button>
    </div>
  </div>

  <!-- Step 3: 確認 -->
  <div class="page" id="page3">
    <div class="screen-title">確認資訊</div>
    <div class="screen-sub">送出前請核對以下資訊</div>
    <div class="card" id="confirmCard"></div>
    <div class="action-row">
      <button class="btn-back" onclick="goStep(2)">←</button>
      <button class="btn-primary" onclick="submitRecord()">✓ 送出紀錄</button>
    </div>
  </div>

  <!-- Step 4: 成功 -->
  <div class="page" id="page4">
    <div class="success-wrap">
      <div class="success-icon">✓</div>
      <div class="success-title">紀錄已儲存</div>
      <div class="success-sub" id="savedId"></div>
      <button class="btn-primary" style="max-width:220px;margin:0 auto" onclick="resetFlow()">繼續下一筆</button>
    </div>
    <div class="card">
      <div class="log-header">
        <span class="log-title">暫存紀錄（localStorage）</span>
        <button class="btn-clear" onclick="clearLogs()">清除全部</button>
      </div>
      <div id="logList"></div>
    </div>
  </div>

</div><!-- /main -->

<canvas id="capCanvas" style="display:none"></canvas>

<script>
// ── App State ──
const S = { workers:[], station:null, stationMethod:null, order:null, orderMethod:null };

// ── Camera State ──
let currentTarget = null;
let currentStream = null;
let rafId = null;
let detector = null;
let torchTrack = null;
let torchOn = false;
let lastCode = null;
const video = document.getElementById('camVideo');
const capCanvas = document.getElementById('capCanvas');
const capCtx = capCanvas.getContext('2d', { willReadFrequently: true });

const CAM_LABELS = { emp:'掃員工條碼', extra:'掃加派員工條碼', st:'掃工站 QR Code', wo:'掃工單條碼' };
const INPUT_IDS  = { emp:'empIn', extra:'extraIn', st:'stIn', wo:'woIn' };

// ── Open Camera ──
async function openCamera(target) {
  currentTarget = target;
  lastCode = null;
  document.getElementById('camLabelText').textContent = CAM_LABELS[target] || '掃描條碼';
  document.getElementById('camStatus').textContent = '初始化相機中…';
  document.getElementById('camFlash').style.display = 'none';
  document.getElementById('torchBtn').classList.remove('visible','on');
  document.getElementById('camOverlay').classList.add('open');

  // Init BarcodeDetector once
  if (!detector && 'BarcodeDetector' in window) {
    try {
      let fmts = ['qr_code','ean_13','ean_8','code_128','code_39','data_matrix','pdf417','aztec','upc_a','upc_e','itf'];
      try { const sup = await BarcodeDetector.getSupportedFormats(); if (sup && sup.length) fmts = sup; } catch(e){}
      detector = new BarcodeDetector({ formats: fmts });
    } catch(e) { detector = null; }
  }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode:{ ideal:'environment' }, width:{ ideal:1280 }, height:{ ideal:720 } }
    });
    currentStream = stream;
    video.srcObject = stream;
    await new Promise((res) => { video.onloadedmetadata = res; setTimeout(res, 3000); });
    await video.play();

    // Torch check
    const [track] = stream.getVideoTracks();
    torchTrack = track;
    try {
      const caps = track.getCapabilities ? track.getCapabilities() : {};
      if (caps.torch) document.getElementById('torchBtn').classList.add('visible');
    } catch(e){}

    const w = video.videoWidth, h = video.videoHeight;
    const msg = detector ? `BarcodeDetector 就緒 (${w}×${h})，對準條碼…` : `相機啟動 (${w}×${h})，對準條碼…`;
    document.getElementById('camStatus').textContent = msg;
    startDetectLoop();

  } catch(e) {
    document.getElementById('camStatus').textContent = '❌ ' + (e.message || e.name);
    if (e.name === 'NotAllowedError') alert('請在瀏覽器允許相機權限後再試');
    else if (e.name === 'NotFoundError') alert('找不到相機裝置');
    else alert('相機啟動失敗：' + e.message);
    closeCamera();
  }
}

// ── Detect Loop (same pattern as your test scanner) ──
let frameCount = 0;
function startDetectLoop() {
  frameCount = 0;
  detectLoop();
}
async function detectLoop() {
  if (!currentStream) return;
  frameCount++;
  if (video.readyState >= 2 && video.videoWidth > 0 && frameCount % 6 === 0) {
    await tryDetect();
  }
  rafId = requestAnimationFrame(detectLoop);
}

async function tryDetect() {
  if (!detector) return;
  try {
    // Method A: detect directly from video
    let codes = await detector.detect(video);
    if (!codes.length) {
      // Method B: via canvas (some devices need this)
      capCanvas.width = video.videoWidth;
      capCanvas.height = video.videoHeight;
      capCtx.drawImage(video, 0, 0);
      codes = await detector.detect(capCanvas);
    }
    if (codes.length) {
      onDetected(codes[0].rawValue);
    }
  } catch(e) { /* silent */ }
}

function onDetected(val) {
  if (!val || val === lastCode) return;
  lastCode = val;

  // Flash
  const fl = document.getElementById('camFlash');
  fl.style.display = 'flex';
  setTimeout(() => fl.style.display = 'none', 350);
  try { navigator.vibrate && navigator.vibrate(60); } catch(e){}

  closeCamera();
  handleResult(val, 'camera');
}

function closeCamera() {
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  if (currentStream) { currentStream.getTracks().forEach(t => t.stop()); currentStream = null; }
  torchTrack = null; torchOn = false;
  video.srcObject = null;
  document.getElementById('camOverlay').classList.remove('open');
}

async function toggleTorch() {
  if (!torchTrack) return;
  torchOn = !torchOn;
  try {
    await torchTrack.applyConstraints({ advanced: [{ torch: torchOn }] });
    document.getElementById('torchBtn').classList.toggle('on', torchOn);
  } catch(e) { torchOn = false; }
}

function focusCurrentInput() {
  const id = INPUT_IDS[currentTarget];
  if (id) setTimeout(() => document.getElementById(id).focus(), 100);
}

// ── Handle scan/camera result ──
function handleResult(val, method) {
  switch(currentTarget) {
    case 'emp':
      if (S.workers.length === 0) {
        S.workers.push({ id:val, method });
        document.getElementById('addWorkerSection').classList.add('visible');
        renderWorkers();
        document.getElementById('btnEmpNext').disabled = false;
        setBoxFilled('empBox', '👤', val, method);
      }
      break;
    case 'extra':
      if (!S.workers.find(w => w.id === val)) {
        S.workers.push({ id:val, method });
        renderWorkers();
      }
      break;
    case 'st':
      S.station = val; S.stationMethod = method;
      setBoxFilled('stBox', '🏭', val, method);
      document.getElementById('btnStNext').disabled = false;
      break;
    case 'wo':
      S.order = val; S.orderMethod = method;
      setBoxFilled('woBox', '📋', val, method);
      document.getElementById('btnWoNext').disabled = false;
      break;
  }
}

// ── Navigation ──
function goStep(n) {
  closeCamera();
  document.querySelectorAll('.page').forEach((p,i) => p.classList.toggle('active', i===n));
  ['sl0','sl1','sl2','sl3'].forEach((id,i) => {
    document.getElementById(id).className = 'step-label'+(i<n?' done':i===n?' active':'');
  });
  ['ss0','ss1','ss2','ss3'].forEach((id,i) => {
    document.getElementById(id).className = 'step-seg'+(i<n?' done':i===n?' active':'');
  });
  document.getElementById('headerStep').textContent = `步驟 ${n+1} / 4`;
  if (n===3) buildConfirm();
  if (n===4) buildLog();
}

// ── Workers ──
function confirmEmp(method) {
  const v = document.getElementById('empIn').value.trim(); if (!v) return;
  if (S.workers.length === 0) {
    S.workers.push({ id:v, method });
    document.getElementById('empIn').value = '';
    document.getElementById('addWorkerSection').classList.add('visible');
    renderWorkers();
    document.getElementById('btnEmpNext').disabled = false;
    setBoxFilled('empBox','👤',v,method);
  }
}
function addExtra(method) {
  const inp = document.getElementById('extraIn');
  const v = inp.value.trim();
  if (!v || S.workers.find(w=>w.id===v)) { inp.value=''; return; }
  S.workers.push({ id:v, method });
  inp.value=''; renderWorkers();
}
function removeWorker(id) {
  S.workers = S.workers.filter(w=>w.id!==id);
  if (S.workers.length===0) {
    document.getElementById('addWorkerSection').classList.remove('visible');
    document.getElementById('btnEmpNext').disabled = true;
    resetBox('empBox','👤','點此輸入員工編號');
  }
  renderWorkers();
}
function renderWorkers() {
  document.getElementById('workersList').innerHTML = S.workers.map(w=>`
    <div class="worker-chip">
      <div class="worker-av">${w.id.slice(-2).toUpperCase()}</div>
      <span class="worker-name">${w.id}</span>
      <span class="badge badge-${w.method}">${w.method}</span>
      <button class="worker-rm" onclick="removeWorker('${w.id}')" aria-label="移除">×</button>
    </div>`).join('');
}

// ── Station / Order ──
function confirmSt(method) {
  const v = document.getElementById('stIn').value.trim(); if (!v) return;
  S.station=v; S.stationMethod=method;
  document.getElementById('stIn').value='';
  setBoxFilled('stBox','🏭',v,method);
  document.getElementById('btnStNext').disabled=false;
}
function confirmWo(method) {
  const v = document.getElementById('woIn').value.trim(); if (!v) return;
  S.order=v; S.orderMethod=method;
  document.getElementById('woIn').value='';
  setBoxFilled('woBox','📋',v,method);
  document.getElementById('btnWoNext').disabled=false;
}

// ── Box helpers ──
function setBoxFilled(id, ico, val, method) {
  const box = document.getElementById(id);
  box.className='scan-target filled';
  box.innerHTML=`<span class="scan-ico">${ico}</span><span class="scan-val">${val}</span><span class="badge badge-${method}">${method}</span>`;
}
function resetBox(id, ico, ph) {
  const box = document.getElementById(id);
  box.className='scan-target';
  box.innerHTML=`<span class="scan-ico">${ico}</span><span class="scan-ph">${ph}</span>`;
}

// ── Confirm ──
function buildConfirm() {
  const wHtml = S.workers.map(w=>
    `<span class="confirm-val-sm">${w.id}</span><span class="badge badge-${w.method}">${w.method}</span>`
  ).join(' ');
  document.getElementById('confirmCard').innerHTML=`
    <div class="confirm-row"><span class="confirm-key">員工</span><div class="confirm-meta">${wHtml}</div></div>
    <div class="confirm-row"><span class="confirm-key">工站</span><div class="confirm-meta"><span class="confirm-val-sm">${S.station}</span><span class="badge badge-${S.stationMethod}">${S.stationMethod}</span></div></div>
    <div class="confirm-row"><span class="confirm-key">工單</span><div class="confirm-meta"><span class="confirm-val-sm">${S.order}</span><span class="badge badge-${S.orderMethod}">${S.orderMethod}</span></div></div>
    <div class="confirm-row"><span class="confirm-key">時間</span><span class="confirm-val">${new Date().toLocaleString('zh-TW')}</span></div>`;
}

// ── Submit ──
function submitRecord() {
  const record = { id:Date.now(), ts:new Date().toISOString(), workers:[...S.workers], station:S.station, stationMethod:S.stationMethod, order:S.order, orderMethod:S.orderMethod };
  const logs = JSON.parse(localStorage.getItem('dip_logs')||'[]');
  logs.unshift(record);
  localStorage.setItem('dip_logs', JSON.stringify(logs.slice(0,100)));
  document.getElementById('savedId').textContent='ID: '+record.id;
  goStep(4);
}

// ── Log ──
function buildLog() {
  const logs = JSON.parse(localStorage.getItem('dip_logs')||'[]');
  const el = document.getElementById('logList');
  if (!logs.length) { el.innerHTML='<div class="log-empty">尚無紀錄</div>'; return; }
  const hasManual = r => r.workers.some(w=>w.method==='manual')||r.stationMethod==='manual'||r.orderMethod==='manual';
  el.innerHTML = logs.map(r=>`
    <div class="log-entry">
      <div class="log-main">
        <div class="log-order">${r.station} → ${r.order}</div>
        <div class="log-detail">${r.workers.map(w=>w.id).join(', ')}</div>
      </div>
      <div class="log-right">
        <div class="log-time">${new Date(r.ts).toLocaleTimeString('zh-TW')}</div>
        <span class="badge ${hasManual(r)?'badge-manual':'badge-scan'}">${hasManual(r)?'含手動':'全掃碼'}</span>
      </div>
    </div>`).join('');
}
function clearLogs() {
  if (confirm('確定要清除所有暫存紀錄？')) { localStorage.removeItem('dip_logs'); buildLog(); }
}

// ── Reset ──
function resetFlow() {
  S.workers=[]; S.station=null; S.stationMethod=null; S.order=null; S.orderMethod=null;
  ['empIn','stIn','woIn','extraIn'].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; });
  document.getElementById('addWorkerSection').classList.remove('visible');
  document.getElementById('workersList').innerHTML='';
  ['btnEmpNext','btnStNext','btnWoNext'].forEach(id=>document.getElementById(id).disabled=true);
  resetBox('empBox','👤','點此輸入員工編號');
  resetBox('stBox','🏭','點此輸入工站代碼');
  resetBox('woBox','📋','點此輸入工單號');
  goStep(0);
}
</script>
